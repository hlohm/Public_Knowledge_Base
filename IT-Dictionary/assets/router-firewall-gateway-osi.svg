<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 545" role="img" aria-labelledby="title desc">
<title id="title">Router, firewall and gateway placed on the OSI layers</title>
<desc id="desc">OSI layers L1 to L7 with the network functions that operate on each. Router sits on L3; gateway appears on L3 and L7; firewall appears on L2, L3/L4 and L7 — showing each is a function, not a single layer. A real edge box bundles them all.</desc>
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  rect{stroke-width:1}
  .lt{font-weight:500;font-size:14px}
  .ln{font-weight:400;font-size:12px}
  .tt{font-weight:500;font-size:14px}
  .st{font-weight:400;font-size:12px}
  .axis{fill:#5F5E5A}
  .legtext{fill:#5F5E5A;font-weight:400;font-size:12px}
  .divider{stroke:#D3D1C7;stroke-width:1;stroke-dasharray:4 4}
  .r-fill{fill:#EEEDFE;stroke:#534AB7} .r-title{fill:#3C3489} .r-sub{fill:#534AB7}
  .f-fill{fill:#FAECE7;stroke:#993C1D} .f-title{fill:#712B13} .f-sub{fill:#993C1D}
  .g-fill{fill:#E1F5EE;stroke:#0F6E56} .g-title{fill:#085041} .g-sub{fill:#0F6E56}
  .s-fill{fill:#F1EFE8;stroke:#5F5E5A} .s-title{fill:#2C2C2A} .s-sub{fill:#5F5E5A}
  .b-fill{fill:#F1EFE8;stroke:#888780} .b-title{fill:#2C2C2A} .b-sub{fill:#444441}
  @media (prefers-color-scheme: dark){
    .axis,.legtext{fill:#9c9a92}
    .divider{stroke:#444441}
    .r-fill{fill:#3C3489;stroke:#AFA9EC} .r-title{fill:#CECBF6} .r-sub{fill:#AFA9EC}
    .f-fill{fill:#712B13;stroke:#F0997B} .f-title{fill:#F5C4B3} .f-sub{fill:#F0997B}
    .g-fill{fill:#085041;stroke:#5DCAA5} .g-title{fill:#9FE1CB} .g-sub{fill:#5DCAA5}
    .s-fill{fill:#2C2C2A;stroke:#888780} .s-title{fill:#D3D1C7} .s-sub{fill:#B4B2A9}
    .b-fill{fill:#2C2C2A;stroke:#888780} .b-title{fill:#F1EFE8} .b-sub{fill:#D3D1C7}
  }
</style>

<text class="lt axis" x="48" y="73" dominant-baseline="central">L7</text>
<text class="ln axis" x="48" y="89" dominant-baseline="central">Application</text>
<text class="lt axis" x="48" y="143" dominant-baseline="central">L4</text>
<text class="ln axis" x="48" y="159" dominant-baseline="central">Transport</text>
<text class="lt axis" x="48" y="213" dominant-baseline="central">L3</text>
<text class="ln axis" x="48" y="229" dominant-baseline="central">Network</text>
<text class="lt axis" x="48" y="283" dominant-baseline="central">L2</text>
<text class="ln axis" x="48" y="299" dominant-baseline="central">Data link</text>
<text class="lt axis" x="48" y="353" dominant-baseline="central">L1</text>
<text class="ln axis" x="48" y="369" dominant-baseline="central">Physical</text>

<g>
  <rect class="g-fill" x="170" y="50" width="210" height="56" rx="8"/>
  <text class="tt g-title" x="275" y="70" text-anchor="middle" dominant-baseline="central">Proxy · App gateway</text>
  <text class="st g-sub" x="275" y="88" text-anchor="middle" dominant-baseline="central">translates protocols</text>
</g>
<g>
  <rect class="f-fill" x="405" y="50" width="210" height="56" rx="8"/>
  <text class="tt f-title" x="510" y="70" text-anchor="middle" dominant-baseline="central">Application firewall</text>
  <text class="st f-sub" x="510" y="88" text-anchor="middle" dominant-baseline="central">L7 inspection, WAF</text>
</g>

<g>
  <rect class="f-fill" x="170" y="120" width="200" height="56" rx="8"/>
  <text class="tt f-title" x="270" y="140" text-anchor="middle" dominant-baseline="central">Stateful firewall</text>
  <text class="st f-sub" x="270" y="158" text-anchor="middle" dominant-baseline="central">ports &amp; state</text>
</g>
<g>
  <rect class="s-fill" x="390" y="120" width="180" height="56" rx="8"/>
  <text class="tt s-title" x="480" y="140" text-anchor="middle" dominant-baseline="central">NAT</text>
  <text class="st s-sub" x="480" y="158" text-anchor="middle" dominant-baseline="central">address translation</text>
</g>

<g>
  <rect class="r-fill" x="170" y="190" width="200" height="56" rx="8"/>
  <text class="tt r-title" x="270" y="210" text-anchor="middle" dominant-baseline="central">Router</text>
  <text class="st r-sub" x="270" y="228" text-anchor="middle" dominant-baseline="central">connects IP networks</text>
</g>
<g>
  <rect class="g-fill" x="390" y="190" width="210" height="56" rx="8"/>
  <text class="tt g-title" x="495" y="210" text-anchor="middle" dominant-baseline="central">Default gateway</text>
  <text class="st g-sub" x="495" y="228" text-anchor="middle" dominant-baseline="central">= next-hop router</text>
</g>

<g>
  <rect class="s-fill" x="170" y="260" width="200" height="56" rx="8"/>
  <text class="tt s-title" x="270" y="280" text-anchor="middle" dominant-baseline="central">Switch · Bridge</text>
  <text class="st s-sub" x="270" y="298" text-anchor="middle" dominant-baseline="central">MAC, one network</text>
</g>
<g>
  <rect class="f-fill" x="390" y="260" width="210" height="56" rx="8"/>
  <text class="tt f-title" x="495" y="280" text-anchor="middle" dominant-baseline="central">Transparent firewall</text>
  <text class="st f-sub" x="495" y="298" text-anchor="middle" dominant-baseline="central">layer-2 bridge mode</text>
</g>

<g>
  <rect class="s-fill" x="170" y="330" width="220" height="56" rx="8"/>
  <text class="tt s-title" x="280" y="350" text-anchor="middle" dominant-baseline="central">Modem · Hub · Repeater</text>
  <text class="st s-sub" x="280" y="368" text-anchor="middle" dominant-baseline="central">signal, no addresses</text>
</g>

<line class="divider" x1="40" y1="398" x2="635" y2="398"/>

<g>
  <rect class="b-fill" x="90" y="410" width="510" height="60" rx="12"/>
  <text class="tt b-title" x="345" y="432" text-anchor="middle" dominant-baseline="central">A real edge box (Fritz!Box, pfSense, UTM)</text>
  <text class="st b-sub" x="345" y="452" text-anchor="middle" dominant-baseline="central">Modem + Switch + Router + Firewall + Gateway in one box</text>
</g>

<rect class="r-fill" x="40" y="500" width="14" height="14" rx="3"/>
<text class="legtext" x="60" y="509" dominant-baseline="central">Router</text>
<rect class="f-fill" x="200" y="500" width="14" height="14" rx="3"/>
<text class="legtext" x="220" y="509" dominant-baseline="central">Firewall</text>
<rect class="g-fill" x="360" y="500" width="14" height="14" rx="3"/>
<text class="legtext" x="380" y="509" dominant-baseline="central">Gateway</text>
<rect class="s-fill" x="520" y="500" width="14" height="14" rx="3"/>
<text class="legtext" x="540" y="509" dominant-baseline="central">Structural</text>
</svg>
